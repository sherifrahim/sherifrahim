<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sherif Rahim — SOC and Security Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080c"/><stop offset="1" stop-color="#0b1420"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d3c0"/><stop offset=".55" stop-color="#5aa9ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx=".78" cy=".3" r=".6"><stop offset="0" stop-color="#34d3c0" stop-opacity=".22"/><stop offset="1" stop-color="#34d3c0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <clipPath id="c"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .ln{opacity:0;animation:show .01s forwards}
    @keyframes show{to{opacity:1}}
    .caret{animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    .rise{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes rise{to{opacity:1;transform:none}}
    .node{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="140" height="320" fill="url(#g)" opacity=".05"/>

    <!-- network -->
    <g stroke="#34d3c0" stroke-opacity=".22" stroke-width="1" fill="none">
      <polyline points="720,60 800,120 880,80 960,150 1040,100 1120,170"/>
      <polyline points="800,120 840,210 960,150"/>
      <polyline points="880,80 920,30 1040,100"/>
      <polyline points="840,210 940,260 1060,230 1120,170"/>
    </g>
    <g fill="#34d3c0">
      <circle class="node" cx="720" cy="60" r="3"/><circle class="node" style="animation-delay:.4s" cx="800" cy="120" r="4"/>
      <circle class="node" style="animation-delay:.8s" cx="880" cy="80" r="3"/><circle class="node" style="animation-delay:1.2s" cx="960" cy="150" r="4"/>
      <circle class="node" style="animation-delay:1.6s" cx="1040" cy="100" r="3"/><circle class="node" style="animation-delay:2s" cx="840" cy="210" r="3"/>
      <circle class="node" style="animation-delay:2.4s" cx="940" cy="260" r="3"/><circle class="node" style="animation-delay:.2s" cx="1060" cy="230" r="3"/>
    </g>
    <g fill="#f87171"><circle class="node" cx="1120" cy="170" r="5"/><circle cx="1120" cy="170" r="12" fill="none" stroke="#f87171" stroke-opacity=".35"/></g>

    <!-- text -->
    <text class="m rise" x="64" y="76" font-size="15" letter-spacing="3" fill="#34d3c0" style="animation-delay:.1s">// SOC &amp; SECURITY ENGINEER · ABU DHABI</text>
    <text class="s rise" x="62" y="150" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#g)" style="animation-delay:.25s">Sherif Rahim</text>
    <text class="s rise" x="64" y="196" font-size="23" fill="#9db0c6" style="animation-delay:.45s">I build SOCs that detect what matters.</text>

    <g class="m" font-size="14.5">
      <text class="ln" x="64" y="244" fill="#5f6d80" style="animation-delay:1.0s">SigninLogs</text>
      <text class="ln" x="64" y="266" fill="#a78bfa" style="animation-delay:1.35s">| where<tspan fill="#e8eef6"> ResultType </tspan><tspan fill="#a78bfa">in</tspan><tspan fill="#4ade80"> ("50126","50053")</tspan></text>
      <text class="ln" x="64" y="288" fill="#a78bfa" style="animation-delay:1.7s">| summarize<tspan fill="#e8eef6"> Failures = </tspan><tspan fill="#5aa9ff">count</tspan><tspan fill="#e8eef6">() by UserPrincipalName</tspan></text>
      <rect class="caret" x="516" y="275" width="8" height="15" fill="#34d3c0" style="animation-delay:2s"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
